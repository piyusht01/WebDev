<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate</title>
    <style>
        body{
            background-color: black;
        }
        #one{
            height: 100px;
            width: 100px;
            background-color: brown;
            margin: 400px;
            transition-duration: 2s;
        }
        #one:hover{
            transform: translate(300px,200px);
            transform: scale(2);
            transform: rotate(1800deg);
        }
    </style>
</head>
<body>
    <div id="one"></div>
</body>
</html>
