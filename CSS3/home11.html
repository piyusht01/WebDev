<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id and classes</title>
    <style>
        div{
            display: flex;
            justify-content: center;
            border: 4px pink solid;
            background-color: beige;
        }
        #box1{
            height: 250px;
            width: 250px;
            border: 2px solid;
            background-color: aqua;
        }
        #box2{
            height: 250px;
            width: 250px;
            border: 2px solid;
            background-color: salmon;
        }
        #box3{
            height: 250px;
            width: 250px;
            border: 2px solid;
            background-color: sienna;
        }
    </style>
</head>
<body><div>
    <div id="box1">
        <center>
            <p>Lorem ipsum dolor sit amet.</p>
        </center>
    </div>
    <div id="box2">
        <center>
            <p>Lorem ipsum dolor sit amet.</p>
        </center>
    </div>
    <div id="box3">
        <center>
            <p>Lorem ipsum dolor sit amet.</p>
        </center>
    </div></div>
</body>
</html>
