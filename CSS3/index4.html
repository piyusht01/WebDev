<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        #container{
            height: 500px;
            width: 500px;
            border: 2px solid; 
            padding: 10px;
        }
        #box1{
            height: 50px;
            width: 250px;
            background-color: blue;
            display: flex;
        }
        #box2{
            height: 100px;
            width: 150px;
            background-color: brown;
            display: flex;
            flex-wrap: wrap;
            align-items: start;
        }
        #box3{
            height: 150px;
            width: 125px;
            background-color: aqua;
            display: flex;
            flex-wrap: wrap;
            align-items: end;
        }
        #box4{
            height: 50px;
            width: 150px;
            background-color: purple;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
        }
    </style>
</head>
<body>
    <div id="container">
    <div id="box1"></div>
    <br>
    <div id="box2"></div>
    <br>
    <div id="box3"></div>
    <br>
    <div id="box4"></div>
</body>
</html>
