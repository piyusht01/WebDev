<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        #parent{
            border: 2px solid;
            height: 100%;
            display: grid;
            grid-template-columns: 500px 500px 500px;
            grid-template-rows: 300px 300px 300px;
            gap: 15px;
        }
        .one{
            border: 2px solid;
        }
        img{
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one" class="one">

        </div>
