<!DOCTYPE html>
<html lang="en">
<head>
    <style>
#box{
    width: 300px;
    height: 300px;
    background-color: green;
    transition: 2s;
}
#box:hover{
    background-color: red;
    border-radius: 50%;
    background-image: linear-gradient(red,green,yellow,blue,brown);
}
#box:hover{
    background-color: red;
    border-radius: 50%;
    background-image: linear-gradient(120deg,red,green);
}
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
