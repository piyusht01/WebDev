<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        #parent{
            height: 200px;
            border: 2px solid;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        #parent div{
            height: 50px;
            width: 400px;
        }
        #one{
            background-color: black;
        }
        #one:hover{
            background-color: red;
            height: 200px;
        }
        #two{
            background-color: black;
        }
        #two:hover{
            background-color: blue;
            height: 200px;
        }
        #three{
            background-color: black;
        }
        #three:hover{
            background-color: green;
            height: 200px;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one"></div>
        <div id="two"></div>
        <div id="three"></div>
</body>
</html>
