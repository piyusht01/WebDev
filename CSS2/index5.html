<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLex</title>
    <style>
        #parent{
            height: 500px;
            width: 500px;
            border: 2px solid black;
            display: flex;
            justify-content: space-around;
            align-items: end;
        }
        #one{
            background-color: aqua;
            height: 100px;
            width: 100px;
            border: 2px solid black;
        }
        #two{
            background-color: brown;
            width: 100px;
            height: 100px;
            border: 2px solid black;
            
        }
        #three{
            background-color: blue;
            height: 100px;
            width: 100px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="parent">
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    </div>
</body>
</html>
