<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <style>
        body{
            background-color: black;
        }
        div{
            background-color: white;
            margin: auto;
            height: 1000px;
            width: 500px;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Student Registration Form</h1>
        <label>Vedam ID:</label>
        <input type="text" placeholder="Enter yor vedam id"> 
        <br>
        <br>
        <label>Name:</label>
        <input type="name" placeholder="Enter your name">
        <br>
        <br>
        <label>Contact:</label>
        <input type="number" placeholder="Enter your contact number">
        <br>
        <br>
        <label>Email id:</label>
        <input type="email" placeholder="Enter your email id">
        <br>
        <br>
        <label>Father's name:</label>
        <input type="text" placeholder="Enter your father's name">
        <br>
        <br>
        <label>Date of birth:</label>
        <input type="date">
        <br>
        <br>
        <label>Gender:</label>
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="Male">
        <label for="gender">Female</label>
        <input type="radio" name="gender" id="Female">
        <br>
        <br>
        <label>Department:</label>
        <label for="derpartment">CSE</label>
        <input type="radio" name="department" id="CSE">
        <label for="department">IT</label>
        <input type="radio" name="department" id="IT">
        <label for="department">ECE</label>
        <input type="radio" name="department" id="ECE">
        <label for="department">Civil</label>
        <input type="radio" name="department" id="Civil">
        <label for="department">Mechanical</label>
        <input type="radio" name="department" id="Mechanical">
        <br>
        <br>
        <label>Course:</label>
        <select>
            <option>AI</option>
            <option>Cyber Security</option>
            <option>AI/ML</option>
            <option>Data Science</option>
            <option>Cloud Computing</option>
            <option>Blockchain</option>
            <option>Computer Science and Business Systems</option>
            <option>Internet of Things</option>
        </select>
        <br>
        <br>
        <label>Student photo:</label>
        <input type="file">
        <br>
        <br>
        <textarea cols="50" rows="5"></textarea>
        <lable>Address</lable>
        <br>
        <br>
        <label>Password:</label>
        <input type="password" min="6" max="8" placeholder="Enter your password">
        <br>
        <br>
        <label>Documents:</label>
        <br>
        <br>
        <label for="checkbox">10th Marksheet</label>
        <input type="checkbox">
        <br>
        <label for="checkbox">12th Marksheet</label>
        <input type="checkbox">
        <br>
        <label for="checkbox">Addhar Card</label>
        <input type="checkbox">
        <br>
        <label for="checkbox">Transfer Certificate</label>
        <input type="checkbox">
        <br>
        <label for="checkbox">Migration Certificate</label>
        <input type="checkbox">
        <br>
        <br>
        <input type="submit">
    </div>
</body>
</html>
