<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        body{
            background-color: black;
        }
        div{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        div:hover{
            animation-name: anime;
            animation-duration: 5s;
        }
        @keyframes anime{
            0%{
                background-color: green;
                border-radius: 50%;
            }
            50%{
                background-color: purple;
                height: 50vh;
                width: 50vw;
            }
            100%{
                border-radius: 100%;
                background-color: brown;
                height: 100vh;
                width: 100vw;
            }
            25%{
                background-color: aqua;
                border-radius: 25%;
                height: 25vh;
                width: 25vw;
            }
            75%{
                background-color: navy;
                border-radius: 75%;
                height: 75vh;
                width: 75vw;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
