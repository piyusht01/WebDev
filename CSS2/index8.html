<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        h2{
            transition-duration: 2s;
            text-align: center;
        }
        h2:hover{
            transform: translate(300px,200px);
            transform: scale(2);
            transform: rotate(1800deg);
        }
    </style>
</head>
<body>
    <h2>Hey!!!!</h2>
</body>
</html>
