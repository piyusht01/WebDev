<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body{
            background-color: black;
        }
        #one{
            height: 350px;
            width: 250px;
            margin: auto;
            border: 2px solid;
            display: grid;
            grid-template-columns: 50px 50px 50px 50px;
            grid-template-rows: 50px 50px 50px 50px; 
            gap: 5px;
        }
       button{
        height: 50px;
        width: 50px;
        border-radius: 50%;
        background-color: grey;
       }
       input{
        width: 200px;
        height: 25px;
       }
    </style>
</head>
<body>
    <div id="one">
        <div class="B"><button>C</button></div>
        <div class="B"><button>**</button></div>
        <div class="B"><button>%</button></div>
        <div class="B"><button>/</button></div>
        <div class="B"><button>7</button></div>
        <div class="B"><button>8</button></div>
        <div class="B"><button>9</button></div>
        <div class="B"><button>*</button></div>
        <div class="B"><button>4</button></div>
        <div class="B"><button>5</button></div>
        <div class="B"><button>6</button></div>
        <div class="B"><button>-</button></div>
        <div class="B"><button>1</button></div>
        <div class="B"><button>2</button></div>
        <div class="B"><button>3</button></div>
        <div class="B"><button>+</button></div>
        <div class="B"><button>0</button></div>
        <div class="B"><button>.</button></div>
        <div class="B"><button>=</button></div>
        <div class="B"><button>back</button></div>
        <input/>
    </div>

    <script>
        let inp=document.querySelector('input')
        let buttons=document.querySelectorAll('button')
        for(let btn of buttons){
            btn.addEventListener("click",function(){
                let text=btn.innerText
                if(text==='C'){
                    inp.value=""
                }
                else if(text==="="){
                    inp.value=eval(inp.value)
                }
                else if(text=="back"){
                    inp.value=inp.value.slice(0,-1)
                }
                else{
                    inp.value+=text
                }
            })
        }
    </script>
</body>
</html>
