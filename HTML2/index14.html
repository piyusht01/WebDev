<html>
<head>
    <title>Profile Card</title>
    <style>
    body {
    background-color: lightgray;
    font-family: Arial, sans-serif;
}

.card {
    width: 300px;
    background-color: white;
    text-align: center;
    margin: 100px auto;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px gray;
}

.card img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
}

.card h2 {
    color: darkblue;
}

.card p {
    color: gray;
}
    </style>
</head>
<body>
    <div class="card">
        <img src="https://fastly.picsum.photos/id/735/200/200.jpg?hmac=XML4Wv2mXSMlQw0EtA5w4gbgWnEexc-t-ulwq8lAu1o" alt="Profile Photo">
        <h2>Piyush Kumar</h2>
        <p>Web Development Student</p>
    </div>
</body>
</html>
