<html>
<head>
    <title>Profile Card</title>
    <style>
        
        .card{
            width: 300px;
            height: 300px;
            text-align: center;
            margin: 100px auto;
            border: 2px solid;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        .card img{
            width: 120px;
            height: 120px;
            border-radius: 15%;
        }
    </style>
</head>
    <body>
        <div class="card">
            <img src="profile.jpg" alt="profile">
            <h2>Rohan Verma</h2>
            <p>Web Designer|HTML,CSS,Figma</p>
            <button>Hire Me</button>
            <button>View work</button>
        </div>
    </body>
</html>
