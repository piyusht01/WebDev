<html>
<head>
    <title>Form</title>
</head>
<body>
    <fieldset>
        <h2>College fest feedback</h2>
        <label>Name:</label>
        <input type="Name" placeholder="Enter your name">
        <br>
        <br>
        <label>Email:</label>
        <input type="email" placeholder="Enter yout email">
        <br>
        <br>
        <label>Rating:</label>
        <label>1</label>
        <input name="Rating" type="radio"/>
        <label>2</label>
        <input name="Rating" type="radio"/>
        <label>3</label>
        <input name="Rating" type="radio"/>
        <label>4</label>
        <input name="Rating" type="radio"/>
        <label>5</label>
        <input name="Rating" type="radio"/>
        <br>
        <br>
        <label>Favourite events:</label>
        <lable>Dance</lable>
        <input type="checkbox"/>
        <label>Music</label>
        <input type="checkbox"/>
        <label>Coding Contest</label>
        <input type="checkbox"/>
        <br>
        <br>
        <textarea cols="30" rows="5"></textarea>
        <br>
        <label>Comments Box</label>
        <br>
        <br>
        <label>Upload photo:</label>
        <input type="file" accept="image">
        <br>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </fieldset>
</body>
</html>
