<html>
    <head>
        <title>Profile Card</title>
        <style>
            .card{
                width: 300px;
                border: 2px solid;
                text-align: center;
                margin: 100px auto;
                padding: 10px;
            }
            .card img{
                height: 120px;
                width: 120px;
                border-radius: 50%;
                border: 2px solid;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="profile.jpg" alt="Profile">
            <h2>John Doe</h2>
            <p>Web Developer</p>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Saepe, voluptas?</p>
        </div>
    </body>
</html>
