<html>
<head>
    <title>Profile Card</title>
</head>
<style>
    .card{
        width: 300px;
        text-align: center;
        margin: 100px auto;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 10px gray;
    }
    .card img{
        width: 120px;
        height: 120px;
        border-radius: 50%;
    }
</style>
<body>
    <div class="card">
        <img src="profile.jpg" alt="Profile">
        <h2>Piyush</h2>
        <p>Web Developer</p>
        <button>View Profile</button>
    </div>
</body>
</html>
