<html>
<head>
    <title>Form</title>
</head>
<body>
    <fieldset>
        <h2>Movie ticket booking</h2>
        <label>Name:</label>
        <input type="name" placeholder="Enter your full name">
        <br>
        <br>
        <label>Date:</label>
        <input type="date">
        <br>
        <br>
        <label>Number of tickets:</label>
        <input type="number" min="1" max="10">
        <br>
        <br>
        <lable>Morning</lable>
        <input name="Time" type="radio"/>
        <lable>Afternoon</lable>
        <input name="Time" type="radio"/>
        <label>Night</label>
        <input name="Time" type="radio"/>
        <br>
        <br>
        <label>Seat type :</label>
        <select>
            <option>Silver</option>
            <option>Gold</option>
            <option>Recliner</option>
        </select>
        <br>
        <br>
        <button type="submit">Book Now</button>
    </fieldset>
</body>
</html>
