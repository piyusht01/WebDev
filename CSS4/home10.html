<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: khaki;
            height: 10000px;
        }
        .box{
            display: inline-block;
            border: 2px solid black;
            width: 100px;
            height: 100px;
            margin: 5px;
        }
        #box1{
            position: relative;
            top: 104px;
            left: 2px;
            background-color: salmon;
        }
        #box1{
            position: relative;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #box3{
            position: relative;
            position: fixed;
            background-color: brown;
            right: 5px;
            bottom: 400px;
        }
        #box4{
            position: relative;
            position: sticky;
            top: 5px;
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="container">
   <div class="box" id="box1">1</div>
   <div class="box" id="box2">2</div>
   <div class="box" id="box3">3</div>
   <div class="box" id="box4">4</div>
</body>
</html>
