<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height,Width,Border and Background</title>
    <style>
        #one{
            height: 200px;
            width: 200px;
            background-color: aqua;
            border: 5px solid green;
            border-radius: 10px;
        }
        #two{
            height: 200px;
            width: 200px;
            background-color: aqua;
            color: brown;
            border: 2px solid blue;
            padding: 5px;
        }
        #three{
            height: 200px;
            width: 200px;
            background-image: none;
            background-color: aquamarine;
            border: 10px solid red;
        }
    </style>
</head>
<body>
    <p id="one">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Earum, aperiam?</p>
    <p id="two">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore esse earum aut omnis quae modi.</p>
    <p id="three">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Natus error dignissimos cumque ratione minus perspiciatis.</p>
</body>
</html>
